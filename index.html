return`<h2>🌟 Opportunities</h2><div class="row">${[["free","Free"],["on","Online"],["pk","Pakistan"],["intl","International"],["soon","Deadline soon"]].map(([k,l])=>`<button class="btn sm ${F[k]?'on':'alt'}" data-f="${k}">${l}</button>`).join("")}</div><div class="grid" style="margin-top:12px">${L.map(o=>`<div class="card"><h3>${o.n}</h3><span class="pill">${o.ty}</span><div class="mut">Deadline ${o.d} · ${o.loc} · ${o.cost} · ${o.on?"Online":"Offline"}<br>Eligibility: ${o.el}<br>Skills: ${o.sk}</div><button class="btn sm" data-t="Opens the official application page (demo link).">Official link</button></div>`).join("")||"<p>No matches.</p>"}</div><p class="mut">Always verify details on the official site.</p>`},
comm(){return`<h2>Find Your People</h2><div class="grid">${COMM.map(c=>`<div class="card"><h3>${c[0]} ${c[1]}</h3><div class="mut">${c[2]} members · posts, projects, events, resources</div><button class="btn sm ${D.c?.includes(c[1])?'on':''}" data-c="${c[1]}">${D.c?.includes(c[1])?"✓ Joined":"Join"}</button></div>`).join("")}</div>`},
events(){const F=S.f;const L=EVENTS.filter(e=>(!F.today||e[1]=="Today")&&(!F.on||e[2]=="Online")&&(!F.inp||e[2]=="In-person"));
return`<h2>📅 Community Calendar</h2><div class="row">${[["today","Today"],["on","Online"],["inp","In-person"]].map(([k,l])=>`<button class="btn sm ${F[k]?'on':'alt'}" data-f="${k}">${l}</button>`).join("")}</div><div class="grid" style="margin-top:12px">${L.map(e=>`<div class="card"><h3>${e[0]}</h3>${e[1]} · ${e[2]} · Free<br><button class="btn sm ${D.ev[e[0]]=="att"?"on":""}" data-a="ev:${e[0]}">${D.ev[e[0]]=="att"?"✓ Attended":D.ev[e[0]]=="rsvp"?"Mark attended":"RSVP"}</button></div>`).join("")}</div>`},
portfolio(){return pfView()},
profile(){const m=D.me;return`${learning()}<h2>My Profile</h2><div class="card"><label>Display name</label><input id="pn" value="${m.n}"><label>Education</label><input id="pg" value="${m.g}"><label>Area</label><input id="pa" value="${m.a}"> <label class="sans"><input type="checkbox" id="ph" ${m.hide?.a?"checked":""}> Hide my area from others</label>
<label>Can teach (comma separated)</label><input id="pt1" value="${m.teach.join(", ")}" style="width:100%"><label>Want to learn</label><input id="pl" value="${m.learn.join(", ")}" style="width:100%"><label>Interests</label><input id="pi" value="${m.int.join(", ")}" style="width:100%"><label>Availability</label><input id="pv" value="${m.av.join(", ")}"><br><button class="btn" id="psave" style="margin-top:10px">Save profile</button></div>
<div class="card" style="margin-top:12px"><b>+ Add a Skill</b><div class="row"><input id="ns" placeholder="Skill, e.g. Excel"><select id="nl"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><select id="nf"><option>Free</option><option>Swap</option></select><input id="nm" type="number" value="5" style="width:80px"><button class="btn" id="nadd">Add</button></div></div>
<div class="card" style="margin-top:12px"><b>🛡️ Privacy & safety</b><br>Only your display name and chosen details are shown. <button class="btn alt sm" data-t="Blocked users list is empty">Block list</button> <button class="btn alt sm" id="rst">Reset demo</button></div>`}};
const sp=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
function draw(){document.body.classList.toggle("low",S.low);document.documentElement.dir=S.lang=="ur"?"rtl":"ltr";$("#lowB").classList.toggle("on",S.low);$("#exL").textContent=t("ex");nav();$("#app").innerHTML=V[S.v]();document.title="She Connects"+(S.v!="home"?" · "+t(S.v):"");
document.querySelectorAll("#app .card h3").forEach(h=>h.insertAdjacentHTML("beforeend",`<i class="ill">${ILL[IK[S.v]||"connect"]}</i>`));$("#lang").value=S.lang;window.scrollTo(0,0)}
const go=v=>{S.v=v;S.f={};draw()};
function doSwap(w,o,r,day,time,fmt){D.swaps.push({id:"w"+Date.now(),w,o:o||"30 min "+D.me.teach[0],r:r||"30 min "+D.me.learn[0],st:"pending",day:day||"Saturday",time:time||"Afternoon",fmt:fmt||"Online"});save();toast("Swap proposed to "+w+" — see My Sessions")}
document.addEventListener("click",e=>{const x=e.target.closest("[data-v],[data-q],[data-swap],[data-a],[data-j],[data-js],[data-sa],[data-sx],[data-sc],[data-f],[data-c],[data-t],[data-rep],#sgo,#mv,#scr,#cert,#cprev,#pgo,#psave,#nadd,#rst,#lowB,#demoB");if(!x)return;e.preventDefault();const d=x.dataset;
if(d.a)return act(d.a);if(d.v)return go(d.v);if(d.q!==undefined){S.q=d.q;S.v="explore";return draw()}
if(d.swap){const u=USERS.find(z=>z.n==d.swap),a=ci(D.me.learn,u.teach)[0],b=ci(D.me.teach,u.learn)[0];doSwap(u.n,"30 min "+(b||D.me.teach[0]),"30 min "+(a||u.teach[0]));return go("swap")}
if(d.j){const i=+d.j;D.joined=D.joined.includes(i)?D.joined.filter(a=>a!=i):[...D.joined,i];if(D.joined.includes(i)){badge("💡 Project Contributor");projAct(i)}else rmAct("pr:"+i);save();return draw()}
if(d.js){D.joinedS=D.joinedS.includes(d.js)?D.joinedS.filter(a=>a!=d.js):[...D.joinedS,d.js];if(D.joinedS.includes(d.js))badge("🌱 First Skill Learned");save();return draw()}
if(d.sa){const z=D.swaps.find(q=>q.id==d.sa);if(z){z.st="scheduled";save();toast(z.w+" accepted — session scheduled")}return draw()}
if(d.sx){D.swaps=D.swaps.filter(q=>q.id!=d.sx);save();toast("Swap cancelled");return draw()}
if(d.sc){const z=D.swaps.find(q=>q.id==d.sc);if(z){z.st="done";badge("🤝 First Skill Exchange");save();swapAct(z)}return draw()}
if(d.f){S.f[d.f]=!S.f[d.f];return draw()}
if(d.c){D.c=D.c||[];D.c.includes(d.c)?D.c=D.c.filter(a=>a!=d.c):D.c.push(d.c);if(D.c.includes(d.c))addAct("cm:"+d.c,"community",{name:d.c},null,"Joined community");else rmAct("cm:"+d.c);save();return draw()}
if(d.t)return toast(d.t);if(d.rep)return toast("Reported "+d.rep+". Our team will review it.");
if(x.id=="sgo"){doSwap($("#sw").value,$("#so").value,$("#sr").value,$("#sdy2").value,$("#stm").value,$("#sfm").value);return draw()}
if(x.id=="pgo"){const t=$("#pt").value.trim();if(!t)return toast("Add a title");D.port.push({k:$("#pk").value,t});badge("🏔️ Chitral Creator");save();return draw()}
if(x.id=="psave"){Object.assign(D.me,{n:$("#pn").value||"Friend",g:$("#pg").value,a:$("#pa").value,teach:sp($("#pt1").value),learn:sp($("#pl").value),int:sp($("#pi").value),av:sp($("#pv").value),hide:{a:$("#ph").checked}});save();toast("Profile saved");return go("home")}
if(x.id=="nadd"){const s=$("#ns").value.trim();if(!s)return toast("Enter a skill");D.me.teach.push(s);badge("🏅 First Skill Shared");save();toast(s+" added ("+$("#nl").value+", "+$("#nf").value+", max "+$("#nm").value+")");return draw()}
if(x.id=="scr"){const t=$("#st").value.trim();if(!t)return toast("Give your session a title");D.sessions.push({id:"u"+Date.now(),t,by:D.me.n,lv:$("#sl").value,d:+$("#sd").value,f:$("#sf").value,day:$("#sdy").value,max:+$("#sm").value||8});badge("🏅 First Skill Shared");save();toast("Session published!");return draw()}
if(x.id=="mv"){const a=+$("#ma").value;if(!a)return toast("Enter your age first");if(a<18)return toast("Mentors must be 18 or older. You can still learn and swap skills!");badge("🌟 Community Mentor");save();return toast("Thank you! We'll verify your details.")}
if(x.id=="cprev")return cert();
if(x.id=="cert"){D.skip=!D.skip;save();return draw()}
if(x.id=="rst"){localStorage.removeItem("sc");location.reload()}
if(x.id=="lowB"){S.low=!S.low;save();return draw()}
if(x.id=="demoB")return demo(0)});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;const p=e.target.selectionStart;draw();const q=$("#q");q.focus();q.setSelectionRange(p,p)}});
$("#lang").onchange=e=>{S.lang=e.target.value;save();draw()};
const STEPS=[["1. Create a profile","profile",()=>{}],["2. Add a skill she can teach","profile",()=>{if(!D.me.teach.includes("Excel")){D.me.teach.push("Excel")}}],["3. Choose what she wants to learn","profile",()=>{if(!D.me.learn.includes("Mathematics"))D.me.learn.push("Mathematics")}],["4. System finds compatible girls","swap",()=>{}],["5. Propose a Skill Swap","swap",()=>doSwap("Mehak","30 min Canva","30 min Python")],["6. Join a project","projects",()=>{if(!D.joined.includes(1))D.joined.push(1);badge("💡 Project Contributor");projAct(1)}],["7. Discover an opportunity","opps",()=>{}],["8. Add the finished project to her portfolio","portfolio",()=>{if(!D.pf.style)pickStyle("creative");completeProj(1,"Team member","");badge("🏔️ Chitral Creator")}]];
function demo(i){const o=$("#ov");if(i>=STEPS.length){o.innerHTML="";toast("Demo complete 🎉");return go("home")}
const s=STEPS[i];s[2]();save();S.v=s[1];S.f={};draw();o.innerHTML=`<div class="demo sans"><b>🎪 ${s[0]}</b> <span class="mut" style="color:#ccc">(${i+1}/${STEPS.length})</span><div class="row" style="margin-top:8px"><button class="btn sm" id="dn">${i==STEPS.length-1?"Finish":"Next →"}</button><button class="btn alt sm" style="color:#fff;border-color:#fff" id="dx">Exit</button></div></div>`;
$("#dn").onclick=()=>demo(i+1);$("#dx").onclick=()=>o.innerHTML=""}

document.addEventListener("change",e=>{const t=e.target.dataset&&e.target.dataset.sf;if(!t)return;const[id,f]=t.split(":"),z=D.swaps.find(q=>q.id==id);if(z){z[f]=e.target.value;save();toast("Session updated")}});
initPF();draw();
if(!S.low){const l=document.createElement("div");l.className="ld";l.innerHTML=document.querySelector(".logo svg").outerHTML+"<b>She Connects</b><small>Learn. Share. Connect. Grow.</small>";document.body.append(l);setTimeout(()=>l.classList.add("x"),900);setTimeout(()=>l.remove(),1300)}
</script></body></html>
